name: Tests Python

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: git config --global init.defaultBranch main
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q src pages tests app.py
      - run: python -m unittest discover -s tests
